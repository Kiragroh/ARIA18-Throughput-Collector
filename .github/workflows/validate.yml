name: Validate collector

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest -r requirements-analysis.txt
      - run: python tools/build_rdl.py
      - run: python tools/validate_rdl.py
      - run: python tools/build_collector_v2.py
      - run: python tools/build_imaging_preflight.py
      - run: python tools/build_fast_collector_v2.py
      - run: python tools/build_preflight_v2.py
      - run: python tools/build_cooperation.py --check
      - run: python -m pytest -q tests
      - run: python validation/compare_baseline.py
