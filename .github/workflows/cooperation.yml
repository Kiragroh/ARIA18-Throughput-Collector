name: Publish cooperation invitation

on:
  push:
    branches: [main]
    paths: ['kooperation/**', '.github/workflows/cooperation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cooperation-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: kooperation
      - uses: actions/deploy-pages@v4
        id: deployment
